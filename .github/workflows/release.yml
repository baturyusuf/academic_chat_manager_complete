name: Publish stable Windows release
on:
  push:
    branches: [publish]
    paths-ignore:
      - '**/*.md'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-windows-release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/publish'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare against latest published release
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [ -z "$tag" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$tag" "$GITHUB_SHA" -- . ':(exclude,glob)**/*.md' ':(exclude,glob)tests/**'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test
        run: |
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare version and public key
        id: version
        env:
          ACM_RELEASE_SIGNING_KEY: ${{ secrets.ACM_RELEASE_SIGNING_KEY }}
        run: |
          $version = python scripts/release_manifest.py prepare --run-number ${{ github.run_number }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build installer
        run: |
          & ./scripts/build_installer.ps1 -Version "${{ steps.version.outputs.version }}"
      - name: Smoke test installed application
        run: ./scripts/smoke_installer.ps1 -Version "${{ steps.version.outputs.version }}"
      - name: Sign installer manifest
        env:
          ACM_RELEASE_SIGNING_KEY: ${{ secrets.ACM_RELEASE_SIGNING_KEY }}
        run: python scripts/release_manifest.py sign --version "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-installer
          path: |
            dist/AcademicChatManager-Setup.exe
            dist/update-manifest.json
          if-no-files-found: error
    outputs:
      version: ${{ steps.version.outputs.version }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-installer
          path: release
      - name: Create immutable versioned release
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --json isDraft --jq '.isDraft' > draft.txt 2>/dev/null; then
            if [ "$(cat draft.txt)" = false ]; then
              echo "Release already published; refusing to overwrite assets."
              exit 0
            fi
            gh release upload "$tag" release/AcademicChatManager-Setup.exe release/update-manifest.json --clobber
          else
            gh release create "$tag" release/AcademicChatManager-Setup.exe release/update-manifest.json \
              --target "$GITHUB_SHA" --title "$tag" --generate-notes --draft
          fi
          # Never promote an older version after a newer one was published.
          latest=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [ -n "$latest" ] && [ "$(printf '%s\n' "$latest" "$tag" | sort -V | tail -n1)" != "$tag" ]; then
            echo "Newer release already exists; leaving this release as draft."
            exit 1
          fi
          gh release edit "$tag" --draft=false --latest
