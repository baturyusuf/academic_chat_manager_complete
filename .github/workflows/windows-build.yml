name: Windows desktop build
on:
  workflow_dispatch:
  push:
    paths:
      - 'academic_chat_manager/**'
      - '.github/workflows/windows-build.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r academic_chat_manager/requirements-dev.txt
      - name: Run automated tests
        run: python -m pytest academic_chat_manager/tests -q
      - name: Build portable folder
        working-directory: academic_chat_manager
        run: python -m PyInstaller --noconfirm --clean AcademicChatManager.spec
      - name: Build single-file executable
        working-directory: academic_chat_manager
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name AkademikSohbetYoneticisi-OneFile --icon assets/app.ico
          --add-data "assets/rumeli_logo.png;assets"
          --add-data "assets/app.ico;assets"
          --collect-submodules telethon --collect-submodules keyring.backends
          --collect-data certifi main.py
      - name: Package portable folder
        run: Compress-Archive -Path academic_chat_manager/dist/AkademikSohbetYoneticisi -DestinationPath AkademikSohbetYoneticisi-Windows-x64-Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AkademikSohbetYoneticisi-Windows-x64-Portable
          path: AkademikSohbetYoneticisi-Windows-x64-Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AkademikSohbetYoneticisi-Windows-x64-EXE
          path: academic_chat_manager/dist/AkademikSohbetYoneticisi-OneFile.exe
