name: Windows desktop build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q main.py media.py messaging.py storage.py telegram_service.py security.py tests
      - name: Run automated tests
        run: python -m pytest tests -q --junitxml=test-results.xml
      - name: Check chat refresh with the native Windows Qt backend
        env:
          QT_QPA_PLATFORM: windows
        run: python -m pytest tests/test_chat_refresh.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: warn
      - name: Build portable folder
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name AkademikSohbetYoneticisi --icon assets/app.ico
          --add-data "assets/rumeli_logo.png;assets"
          --add-data "assets/app.ico;assets"
          --collect-submodules telethon --collect-submodules keyring.backends
          --collect-data certifi main.py
      - name: Build single-file executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name AkademikSohbetYoneticisi-OneFile --icon assets/app.ico
          --add-data "assets/rumeli_logo.png;assets"
          --add-data "assets/app.ico;assets"
          --collect-submodules telethon --collect-submodules keyring.backends
          --collect-data certifi main.py
      - name: Verify outputs and package portable folder
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/AkademikSohbetYoneticisi/AkademikSohbetYoneticisi.exe')) { throw 'Portable EXE missing' }
          if (-not (Test-Path 'dist/AkademikSohbetYoneticisi-OneFile.exe')) { throw 'Single-file EXE missing' }
          Compress-Archive -Path dist/AkademikSohbetYoneticisi -DestinationPath AkademikSohbetYoneticisi-Windows-x64-Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AkademikSohbetYoneticisi-Windows-x64-Portable
          path: AkademikSohbetYoneticisi-Windows-x64-Portable.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AkademikSohbetYoneticisi-Windows-x64-EXE
          path: dist/AkademikSohbetYoneticisi-OneFile.exe
          if-no-files-found: error
